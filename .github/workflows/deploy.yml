name: Deploy to Oracle VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VM_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # node_modules/.next trên VM được giữ lại (excluded) để build lần sau nhanh hơn
      - name: Upload source
        run: >
          rsync -az --delete
          --exclude .git --exclude node_modules --exclude .next --exclude .env
          ./ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/trebinhdinh/src/

      - name: Build & restart
        run: ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} 'bash /opt/trebinhdinh/src/deploy/deploy.sh'
